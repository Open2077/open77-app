services:
  status-monitor:
    image: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    working_dir: /app
    command: [node, monitor.mjs]
    environment:
      OP77_STATUS_DATA_DIR: /data
      OP77_STATUS_OUTPUT: /public/v1.json
      OP77_STATUS_REGION: ${OP77_STATUS_REGION:-Single operator probe}
      OP77_STATUS_MAINTENANCE: /config/maintenance.json
    volumes:
      - ./:/app:ro
      - ./config:/config:ro
      - ./data:/data
      # Point this at a NEW directory served by the public file server, not its root.
      - ${OP77_STATUS_PUBLIC_DIR:-./public}:/public
    healthcheck:
      test: [CMD, node, -e, "const f=require('node:fs');const s=JSON.parse(f.readFileSync('/public/v1.json'));process.exit(Date.now()-Date.parse(s.generatedAt)<180000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
